{% extends 'admin_portal/dashboard.html' %}
{% load static %}
{% block title %}Add Class - Mid Point School{% endblock %}
{% block body %}
<div class="dashboard-layout">
    <!-- Sidebar -->
    {% include 'admin_portal/sidebar.html' %}
    <main class="main-content">
        <div class="top-header">
            <h1 class="page-title">{{ title }}</h1><a href="{% url 'class_list' %}" class="btn btn-outline">← Back</a>
        </div>
        <div class="card" style="max-width: 500px;">
            <form method="post">
                {% csrf_token %}
                <div class="form-group"><label class="form-label">Class Name *</label>{{ form.class_name }}</div>
                <div class="form-group"><label class="form-label">Section *</label>{{ form.section }}</div>
                <div class="form-group"><label class="form-label">Strength</label>{{ form.strength }}</div>
                <button type="submit" class="btn btn-primary">Save Class</button>
            </form>
        </div>
    </main>
</div>
{% endblock %}
